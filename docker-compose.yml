services:
  youtube-mp3-bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - AUDIO_BITRATE=${AUDIO_BITRATE:-192}
      - MAX_PLAYLIST_ITEMS=${MAX_PLAYLIST_ITEMS:-50}
      - MAX_DURATION_SECONDS=${MAX_DURATION_SECONDS:-7200}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-2}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-}
      - COOKIES_FILE=${COOKIES_FILE:-}
      - PROXY_URL=${PROXY_URL:-}
    # Используем tmpfs или volume для временных файлов, чтобы не засорять диск
    tmpfs:
      - /app/downloads:size=1G,mode=1777
